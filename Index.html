<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bindi Try-On</title>
<style>
:root{--bg:#fbf3e6;--ink:#3b1018;--mar:#7a1630;--gold:#c8891e;--card:#fffaf0;--line:#e6d3b3}
@media(prefers-color-scheme:dark){:root{--bg:#24090f;--ink:#f6e8d2;--mar:#e0576f;--gold:#e5a93d;--card:#34111a;--line:#5a2230}}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.9rem;margin:0 0 4px;color:var(--mar);font-weight:600}
p.sub{margin:0 0 16px;opacity:.8}
.stage{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:3/4;display:grid;place-items:center;border:2px solid var(--line)}
canvas{width:100%;height:100%;object-fit:contain;display:block}
#cv{touch-action:none;cursor:grab}
#msg{position:absolute;inset:auto 12px 12px 12px;text-align:center;color:#fff;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:10px;font:14px system-ui,sans-serif}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
button,label.btn{font:600 15px system-ui,sans-serif;padding:11px 16px;border-radius:999px;border:1.5px solid var(--mar);background:transparent;color:var(--mar);cursor:pointer}
button.primary{background:var(--mar);color:#fff}
button:focus-visible,label.btn:focus-within,.pick:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.picker{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px}
.pick{flex:0 0 auto;width:68px;height:68px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:0;display:grid;place-items:center}
.pick[aria-pressed=true]{border-color:var(--mar);box-shadow:0 0 0 2px var(--mar)}
.pick canvas{width:48px;height:48px}
.size{display:flex;align-items:center;gap:12px;font:14px system-ui,sans-serif}
.size input{flex:1;accent-color:var(--mar)}
small{display:block;margin-top:18px;opacity:.65;font:13px system-ui,sans-serif}
#chips,.nudge{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;align-items:center}
#chips button,.nudge button{white-space:nowrap;padding:8px 13px;font-size:14px}
button[aria-pressed=true]{background:var(--mar);color:#fff}
.lbl{margin:8px 0 4px;font:600 14px system-ui,sans-serif}
input[type=file]{position:absolute;opacity:0;width:0;height:0}
</style></head><body><main>
<h1>Try the bindi on</h1>
<p class="sub">Pick a bindi and where you wear it. It shows at its real size.</p>
<div class="stage"><canvas id="cv" width="720" height="960"></canvas><div id="msg">Start the camera or upload a selfie.</div></div>
<div class="row">
 <button class="primary" id="camBtn">Start camera</button>
 <label class="btn">Upload selfie<input type="file" id="photo" accept="image/*"></label>
 <button id="snap">Save photo</button>
 <button id="reset">Reset position</button>
</div>
<div class="picker" id="picker" role="group" aria-label="Choose a bindi"></div>
<p class="lbl">Where do you wear it? <span id="mmTxt"></span></p>
<div id="chips" role="group" aria-label="Where do you wear it"></div>
<div class="nudge"><span class="lbl">Fine-tune</span>
<button data-n="-1,0" aria-label="Move left">◀</button><button data-n="0,-1" aria-label="Move up">▲</button><button data-n="0,1" aria-label="Move down">▼</button><button data-n="1,0" aria-label="Move right">▶</button></div>
<small style="margin-top:6px">Tip: tap or drag on your forehead to place it exactly.</small>
<div class="row"><label class="btn">Add your own bindi (PNG)<input type="file" id="own" accept="image/png,image/webp"></label></div>
<small>Your camera feed stays on your device and is never uploaded.</small>
</main>

const D=IMG.map((u,i)=>{const im=new Image();im.src=u;return["Bindi "+(i+1),c=>c.drawImage(im,-1,-1,2,2),im]});
let cur=0, custom=null, scale=1;
const picker=$("picker");
function thumb(i,name,fn){const b=document.createElement("button");b.className="pick";b.title=name;b.setAttribute("aria-label",name);b.setAttribute("aria-pressed",i===cur);
 const t=document.createElement("canvas");t.width=t.height=96;const c=t.getContext("2d");c.translate(48,48);c.scale(26,26);fn(c);b.append(t);
 b.onclick=()=>{cur=i;custom=null;[...picker.children].forEach((x,k)=>x.setAttribute("aria-pressed",k===i));redraw()};picker.append(b)}
Promise.all(D.map(d=>d[2].decode())).then(()=>D.forEach((d,i)=>thumb(i,d[0],d[1])));
$("own").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{custom=im;[...picker.children].forEach(x=>x.setAttribute("aria-pressed",false));redraw()};im.src=URL.createObjectURL(f)};

const DEFAULT_MM=14, MM={}; // real width in mm per bindi number, e.g. MM[3]=12
const mmOf=()=>custom?DEFAULT_MM:(MM[cur+1]||DEFAULT_MM);
const updMm=()=>{$("mmTxt").textContent="· real size "+mmOf()+" mm"};
const PRE=[["Between eyebrows",0,0],["A little higher",0,-.05],["Mid forehead",0,-.11],["Near hairline",0,-.19],["Left a bit",-.05,-.02],["Right a bit",.05,-.02]];
let off={x:0,y:0}, last={fw:1,ang:0,p:{x:0,y:0}}, drag=false, ppmS=0;
try{const s=JSON.parse(localStorage.getItem("bindiOff"));if(s&&isFinite(s.x)&&isFinite(s.y))off={x:s.x,y:s.y}}catch(e){}
const save=()=>{try{localStorage.setItem("bindiOff",JSON.stringify(off))}catch(e){}};
const chips=$("chips");
const mark=()=>[...chips.children].forEach((b,i)=>b.setAttribute("aria-pressed",Math.abs(PRE[i][1]-off.x)<.004&&Math.abs(PRE[i][2]-off.y)<.004));
PRE.forEach(q=>{const b=document.createElement("button");b.textContent=q[0];b.onclick=()=>{off={x:q[1],y:q[2]};save();mark();redraw()};chips.append(b)});
document.querySelectorAll(".nudge button").forEach(b=>b.onclick=()=>{const[dx,dy]=b.dataset.n.split(",").map(Number);off={x:off.x+dx*.006,y:off.y+dy*.006};save();mark();redraw()});
mark();updMm();
function pxPerMm(P,fw){let m=fw/140;
 if(lm.length>477){const d=(a,b)=>{const u=P(a),v=P(b);return Math.hypot(u.x-v.x,u.y-v.y)};
  const iris=(d(469,471)+d(470,472)+d(474,476)+d(475,477))/4,q=iris/fw;if(q>.06&&q<.11)m=iris/11.7}
 ppmS=ppmS?ppmS*.85+m*.15:m;return ppmS}
let lm=null, src=null, mirror=false, landmarker=null, stream=null, vid=document.createElement("video");
vid.playsInline=true;vid.muted=true;
async function load(){if(landmarker)return;say("Loading face tracking…");
 const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
 landmarker=await FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:"GPU"},runningMode:"VIDEO",numFaces:1})}

function frame(){ // draw source + bindi
 if(!src)return;const W=cv.width,H=cv.height,sw=src.videoWidth||src.naturalWidth,sh=src.videoHeight||src.naturalHeight;
 const k=Math.min(W/sw,H/sh),w=sw*k,h=sh*k,ox=(W-w)/2,oy=(H-h)/2;
 ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);ctx.save();
 if(mirror){ctx.translate(W,0);ctx.scale(-1,1)}ctx.drawImage(src,ox,oy,w,h);ctx.restore();
 if(!lm)return;
 const P=i=>{const p=lm[i];const x=ox+p.x*w;return{x:mirror?W-x:x,y:oy+p.y*h}};
 let a=P(234),b=P(454);if(a.x>b.x)[a,b]=[b,a];
 const fw=Math.hypot(b.x-a.x,b.y-a.y),ang=Math.atan2(b.y-a.y,b.x-a.x);
 const n=P(168),t=P(9),p={x:n.x+(t.x-n.x)*.7,y:n.y+(t.y-n.y)*.7};
 last={fw,ang,p};const wpx=mmOf()*pxPerMm(P,fw);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(ang);ctx.translate(off.x*fw,off.y*fw);
 if(custom){const ar=custom.height/custom.width;ctx.drawImage(custom,-wpx/2,-wpx*ar/2,wpx,wpx*ar)}else{ctx.scale(wpx/2,wpx/2);D[cur][1](ctx)}
 ctx.restore()}
function redraw(){updMm();if(src&&!stream)frame()}

async function loop(){if(!stream)return;
 if(vid.readyState>=2){const r=landmarker.detectForVideo(vid,performance.now());lm=r.faceLandmarks[0]||null;say(lm?"":"Face the camera in good light.");frame()}
 requestAnimationFrame(loop)}
$("camBtn").onclick=async()=>{
 try{await load();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:960},height:{ideal:1280}}});
 vid.srcObject=stream;await vid.play();src=vid;mirror=true;ppmS=0;cv.width=720;cv.height=960;say("");loop();$("camBtn").textContent="Camera on"}
 catch(e){say("Camera unavailable. Allow access, or upload a selfie instead.")}};
$("photo").onchange=async e=>{const f=e.target.files[0];if(!f)return;
 try{await load();stream&&stream.getTracks().forEach(t=>t.stop());stream=null;$("camBtn").textContent="Start camera";
 const im=new Image();im.onload=async()=>{await landmarker.setOptions({runningMode:"IMAGE"});
  const r=landmarker.detect(im);await landmarker.setOptions({runningMode:"VIDEO"});
  lm=r.faceLandmarks[0]||null;src=im;mirror=false;ppmS=0;frame();say(lm?"":"No face found. Try a clear, front-facing photo.");if(lm)say("")};
 im.src=URL.createObjectURL(f)}catch(e){say("Could not load face tracking. Check your connection.")}};
const toLocal=e=>{const R=cv.getBoundingClientRect(),k=cv.width/R.width,dx=(e.clientX-R.left)*k-last.p.x,dy=(e.clientY-R.top)*k-last.p.y,c=Math.cos(-last.ang),s=Math.sin(-last.ang);return{x:(dx*c-dy*s)/last.fw,y:(dx*s+dy*c)/last.fw}};
const put=e=>{off=toLocal(e);mark();redraw()};
cv.addEventListener("pointerdown",e=>{if(!lm)return;drag=true;cv.setPointerCapture(e.pointerId);put(e)});
cv.addEventListener("pointermove",e=>{if(drag)put(e)});
const end=()=>{if(drag){drag=false;save()}};cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
$("reset").onclick=()=>{off={x:0,y:0};save();mark();redraw()};
$("snap").onclick=()=>{if(!src){say("Start the camera or upload a selfie first.");return}
 cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="my-bindi-look.png";a.click()})};
</script></body></html>
